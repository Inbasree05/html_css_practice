<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="top-section">
            <img src="https://images.unsplash.com/photo-1473773508845-188df298d2d1?q=80&w=1000&auto=format&fit=crop" class="cover" alt="top_image">
        </div>
        <div class="profile-section">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-pic" alt="profile_image">
            <h2>Morgan Sweeny</h2>
            <p class="role">Art Collector</p>
            <div class="stats">
                <div>
                    <h3>12</h3>
                    <span>Followers</span>
                </div>
                <div>
                    <h3>1000</h3>
                    <span>Following</span>
                </div>
            </div>
            <button>Follow</button>
            <p class="description">
                Morgan has collected ants since childhood and loves nature photography.
            </p>
        </div>
    </div>
</body>
</html>
