<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Styles</title>
    <style>
        .movie1{
            width:300px;
            height:200px;
            object-fit:cover;
            border-color: blue;
            border-width:2px;
            border-style:solid;
            border-radius:8px;
            margin-left:18px;
            box-shadow: 5px 10px 10px gray;
        }
        .movie2{
            width:300px;
            height:200px;
            object-fit:cover;
            border-color: blue;
            border-width:2px;
            border-style:solid;
            border-radius:4px;
            margin-left:18px;
            box-shadow: 5px 10px 10px gray;
        }
        .movie3{
            width:300px;
            height:200px;
            object-fit:cover;
            border-color: blue;
            border-width:2px;
            border-style:solid;
            border-radius:60%;
            margin-left:18px;
            box-shadow: 5px 10px 10px gray;
        }
    </style>
</head>
<body>
    <img class="movie1" src="movie1.jpg" alt="Movie1">
    <img class="movie2" src="movie2.jpg" alt="Movie2">
    <img class="movie3" src="movie1.jpg" alt="Movie3">
</body>
</html>
