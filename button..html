<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .click{
            background-color: rgb(255, 0, 0);
            color:white;
            height:36px;
            width:100px;
            border:0cap;
            border-radius:2px;
            cursor:pointer;
            margin-right:40px;
            vertical-align:top;
        }
        .submit{
            background-color:white;
            border-style:solid;
            border-color:blue;
            height:36px;
            width: 70px;
            color:blue;
            border-radius:2px;
            cursor:pointer;
            margin-right:40px;
        }
        .click:hover{
            opacity:0.8; 
        }
        .click:active{
            opacity:0.5;
        }
        .submit:hover{
            background-color:blue;
            color:white;
            transition:background-color 1s,color 1s;
        }
        .submit:active{
            opacity:0.7;
        }
        .new{
            background-color:blue;
            color:white;
            font-size:18px;
            font-weight:bold;
            border:none;
            height:45px;
            width:90px;
            border-radius:30px;
            box-shadow: 5px 15px 10px gray;
            cursor:pointer;
        }
        .new:hover{
            box-shadow:5px 10px 10px gray;
            transition:box-shadow 0.15s;
        }
    </style>
</head>
<body>
    <h1>Button Description</h1>
    <button class="click">Click Me!</button>
    <button class="submit">Submit</button>
    <button class="new">Tweet</button>
    
</body>
</html>
